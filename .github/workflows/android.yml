name: Build Chronics APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK platform 37
        run: |
          SDKMANAGER=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # The same key must sign every APK, otherwise Android refuses to install
      # an update over the previous build and the app has to be uninstalled.
      # The key lives in repository secrets and never enters the checkout.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CHRONICS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CHRONICS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CHRONICS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CHRONICS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::A release must be signed with the stable key, but CHRONICS_KEYSTORE_BASE64 is missing."
              exit 1
            fi
            echo "::warning::Signing key secret is missing; the APK will use throwaway debug signing and updates will need a reinstall."
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/chronics.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          {
            echo "CHRONICS_KEYSTORE_PATH=$KEYSTORE"
            echo "CHRONICS_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "CHRONICS_KEY_ALIAS=$KEY_ALIAS"
            echo "CHRONICS_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Signing key restored."

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Release builds are only produced for main and tags. Pull requests from
      # forks and Dependabot have no signing secrets, so an unsigned release
      # would be useless there.
      - name: Assemble release APK
        if: github.event_name != 'pull_request'
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK signatures
        if: env.CHRONICS_KEYSTORE_PATH != ''
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          : > signature.txt
          for APK in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            [ -f "$APK" ] || continue
            echo "### $APK" >> signature.txt
            "$APKSIGNER" verify --print-certs "$APK" >> signature.txt
          done
          cat signature.txt
          {
            echo "### APK signatures"
            echo '```'
            cat signature.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          DEBUG_SHA=$(grep -m1 'SHA-256 digest' signature.txt | awk '{print $NF}')
          RELEASE_SHA=$(grep 'SHA-256 digest' signature.txt | tail -1 | awk '{print $NF}')
          if [ -n "$RELEASE_SHA" ] && [ "$DEBUG_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::Debug and release APKs are signed by different keys."
            exit 1
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: chronics-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        if: github.event_name != 'pull_request' && success()
        uses: actions/upload-artifact@v7
        with:
          name: chronics-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chronics-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release APK
        uses: actions/download-artifact@v8
        with:
          name: chronics-release-apk
          path: dist

      # Never publish an APK that is not signed with the stable key.
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$APKSIGNER" ]; then
            SDKMANAGER=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" --install "build-tools;36.0.0" > /dev/null
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          fi
          APK=$(ls dist/*.apk | head -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee signature.txt
          {
            echo "### Release APK signature"
            echo '```'
            cat signature.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
            exit 0
          fi
          ARGS=(--prerelease --verify-tag --title "Chronics ${GITHUB_REF_NAME}")
          if [ -f "$NOTES" ]; then
            ARGS+=(--notes-file "$NOTES")
          else
            ARGS+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.apk "${ARGS[@]}"
